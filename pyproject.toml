[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyMongoLMDB"
version = "1.0.0"
description = "A high-performance asynchronous MongoDB Atlas library with in-process LMDB caching and write buffering."
readme = "README.md"
authors = [
    { name = "Ayush", email = "MightyAyush.github.io" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pymongo>=4.8.0",
    "lmdb>=1.4.1",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]
requires-python = ">=3.10"

[tool.setuptools]
packages = ["PyMongoLMDB"]

